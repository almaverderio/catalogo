<html lang="pt-BR">
<head>

  <title>Catálogo Kokedamas e Terrários</title>

  <style>
    :root{
      --green:#244b35;
      --green2:#3f7656;
      --soft:#f4f7f1;
      --card:#ffffff;
      --text:#1f2a24;
      --muted:#66756b;
      --gold:#c89f5d;
      --shadow:0 12px 35px rgba(31,42,36,.12);
      --radius:22px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,#f7faf4,#edf4eb);
      color:var(--text);
    }

    header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(244,247,241,.94);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(36,75,53,.12);
    }

    .topo{
      max-width:1150px;
      margin:auto;
      padding:14px 16px;
      display:flex;
      align-items:center;
      gap:14px;
    }

    .logo{
      width:58px;
      height:58px;
      border-radius:18px;
      background:var(--green);
      object-fit:cover;
    }

    .brand h1{
      margin:0;
      font-size:20px;
      color:var(--green);
    }

    .brand p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .container{
      max-width:1150px;
      margin:auto;
      padding:18px 16px 40px;
    }

    .hero{
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:white;
      border-radius:28px;
      padding:24px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }

    .hero h2{
      margin:0 0 8px;
      font-size:28px;
    }

    .hero p{
      margin:0;
      color:#e8f2e8;
      line-height:1.5;
    }

    .filters{
      display:grid;
      grid-template-columns:1.5fr 1fr 1fr 1fr;
      gap:10px;
      margin:18px 0;
    }

    input,select{
      width:100%;
      padding:14px;
      border-radius:16px;
      border:1px solid rgba(36,75,53,.18);
      background:white;
      font-size:15px;
      outline:none;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      border:1px solid rgba(36,75,53,.08);
      display:flex;
      flex-direction:column;
    }

    .foto{
      width:100%;
      height:235px;
      object-fit:cover;
      background:#dfe8dc;
    }

    .content{
      padding:16px;
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .tag{
      display:inline-block;
      background:#eaf2e7;
      color:var(--green);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      margin-bottom:10px;
      width:max-content;
    }

    .card h3{
      margin:0 0 6px;
      font-size:19px;
      color:var(--green);
    }

    .desc{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
      margin:0 0 12px;
    }

    .info{
      display:grid;
      gap:7px;
      margin-bottom:14px;
      font-size:14px;
    }

    .preco{
      font-size:24px;
      font-weight:bold;
      color:var(--green);
      margin-top:auto;
    }

    .botoes{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:14px;
    }

    button{
      border:0;
      border-radius:15px;
      padding:13px 10px;
      font-weight:bold;
      cursor:pointer;
      font-size:14px;
    }

    .btn-msg{
      background:var(--green);
      color:white;
    }

    .btn-img{
      background:#efe7d8;
      color:#6b4c1f;
    }

    .empty{
      text-align:center;
      padding:35px;
      color:var(--muted);
      display:none;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      background:var(--green);
      color:white;
      padding:13px 18px;
      border-radius:999px;
      box-shadow:var(--shadow);
      opacity:0;
      pointer-events:none;
      transition:.3s;
      z-index:99;
      font-size:14px;
    }

    .toast.show{
      opacity:1;
      bottom:34px;
    }

    @media(max-width:900px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .filters{grid-template-columns:1fr 1fr}
    }

    @media(max-width:620px){
      .topo{padding:12px}
      .logo{width:50px;height:50px}
      .brand h1{font-size:17px}
      .hero{padding:20px;border-radius:22px}
      .hero h2{font-size:23px}
      .filters{grid-template-columns:1fr}
      .grid{grid-template-columns:1fr}
      .foto{height:260px}
      .botoes{grid-template-columns:1fr}
    }
  </style>
</head>

      <option value="Grande">Grande</option>

    </select>
  </section>

  <section id="catalogo" class="grid"></section>
  <div id="empty" class="empty">Nenhum produto encontrado.</div>

</main>

    {
      nome: "Terrário Vida Vertical Especial",
      categoria: "Terrário",
      tamanho: "Grande",
      preco: 150,
      planta: "Plantas ornamentais selecionadas",
      cuidados: "Luz indireta e rega moderada.",
      descricao: "Peça de destaque para ambientes sofisticados.",
      foto: "img/vidavertical2.JPG"
    }
  ];

  const catalogo = document.getElementById("catalogo");
  const pesquisa = document.getElementById("pesquisa");
  const categoria = document.getElementById("categoria");
  const tamanho = document.getElementById("tamanho");
  const preco = document.getElementById("preco");
  const empty = document.getElementById("empty");
  const toast = document.getElementById("toast");

  function dinheiro(valor){
    return valor.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });
  }

  function mostrarToast(texto){
    toast.textContent = texto;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function mensagemProduto(produto){
    return `Oi! Temos essa opção linda disponível 🌿

${produto.nome}
Valor: ${dinheiro(produto.preco)}
Tamanho: ${produto.tamanho}

${produto.descricao}

Cuidados: ${produto.cuidados}

É artesanal e temos poucas unidades. Posso separar para você?`;
  }

  async function copiarMensagem(produto){
    await navigator.clipboard.writeText(mensagemProduto(produto));
    mostrarToast("Mensagem copiada!");
  }

  async function copiarImagem(produto){
    try{
      if(!navigator.clipboard || !window.ClipboardItem){
        mostrarToast("Seu navegador não permite copiar imagem.");
        return;
      }

      const imagem = new Image();
      imagem.crossOrigin = "anonymous";
      imagem.src = produto.foto;

      imagem.onload = async function(){
        try{
          const canvas = document.createElement("canvas");
          canvas.width = imagem.naturalWidth;
          canvas.height = imagem.naturalHeight;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(imagem, 0, 0);

          canvas.toBlob(async function(blob){
            if(!blob){
              mostrarToast("Não foi possível copiar a imagem.");
              return;
            }

            await navigator.clipboard.write([
              new ClipboardItem({
                "image/png": blob
              })
            ]);

            mostrarToast("Imagem copiada!");
          }, "image/png");
        }catch(erro){
          mostrarToast("Não foi possível copiar a imagem.");
        }
      };

      imagem.onerror = function(){
        mostrarToast("Imagem não encontrada.");
      };
    }catch(erro){
      mostrarToast("Não foi possível copiar a imagem.");
    }
  }

  function renderizar(){
    const termo = pesquisa.value.toLowerCase().trim();
    const cat = categoria.value;
    const tam = tamanho.value;
    const faixa = preco.value;

    const filtrados = produtos.filter(produto => {
      const textoProduto = `
        ${produto.nome}
        ${produto.categoria}
        ${produto.tamanho}
        ${produto.planta}
        ${produto.preco}
        ${produto.descricao}
      `.toLowerCase();

      const batePesquisa = textoProduto.includes(termo);
      const bateCategoria = !cat || produto.categoria === cat;
      const bateTamanho = !tam || produto.tamanho === tam;

      let batePreco = true;
      if(faixa){
        const partes = faixa.split("-");
        const min = Number(partes[0]);
        const max = Number(partes[1]);
        batePreco = produto.preco >= min && produto.preco <= max;
      }

      return batePesquisa && bateCategoria && bateTamanho && batePreco;
    });

    catalogo.innerHTML = "";

    filtrados.forEach(produto => {
      const card = document.createElement("article");
      card.className = "card";

      card.innerHTML = `
        <img class="foto" src="${produto.foto}" alt="${produto.nome}" onerror="this.src='https://placehold.co/600x450/e8f1e5/244b35?text=Foto+nao+encontrada'">

        <div class="content">
          <span class="tag">${produto.categoria} • ${produto.tamanho}</span>
          <h3>${produto.nome}</h3>
          <p class="desc">${produto.descricao}</p>

          <div class="info">
            <div><strong>Planta/Composição:</strong> ${produto.planta}</div>
            <div><strong>Cuidados:</strong> ${produto.cuidados}</div>
          </div>

          <div class="preco">${dinheiro(produto.preco)}</div>

          <div class="botoes">
            <button class="btn-msg">Copiar mensagem</button>
            <button class="btn-img">Copiar imagem</button>
          </div>
        </div>
      `;

      card.querySelector(".btn-msg").addEventListener("click", () => copiarMensagem(produto));
      card.querySelector(".btn-img").addEventListener("click", () => copiarImagem(produto));

      catalogo.appendChild(card);
    });

    empty.style.display = filtrados.length ? "none" : "block";
  }

  pesquisa.addEventListener("input", renderizar);
  categoria.addEventListener("change", renderizar);
  tamanho.addEventListener("change", renderizar);
  preco.addEventListener("change", renderizar);

  renderizar();
</script>

</body>
</html>
